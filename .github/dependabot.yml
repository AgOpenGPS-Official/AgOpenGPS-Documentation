version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Wait a week before proposing a new release, so broken or compromised
    # releases are usually caught before they reach us. Security updates
    # are not delayed.
    cooldown:
      default-days: 7
    groups:
      npm:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ['*']
