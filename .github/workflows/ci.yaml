name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  pages: read # configure-pages reads the Pages URL

# One run per branch or PR: a new push cancels an outdated PR build, but never
# a deployment that is already running.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'
      - name: Install packages
        run: npm ci
      - name: Get GitHub Pages URL
        id: pages
        uses: actions/configure-pages@v6
      - name: Build
        run: npm run build
        env:
          # Lets the site work under a sub-path, e.g. on a fork's Pages site
          SITE_ORIGIN: ${{ steps.pages.outputs.origin }}
          SITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'npm'
      - name: Install packages
        run: npm ci
      - name: Check formatting
        run: npm run format:check

  # Waits for the build only: a formatting slip on main should not hold back
  # the site.
  deploy:
    if: github.event_name == 'push'
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
